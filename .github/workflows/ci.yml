name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: timelycapsule
          POSTGRES_PASSWORD: timelycapsule
          POSTGRES_DB: timelycapsule
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U timelycapsule"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://timelycapsule:timelycapsule@localhost:5433/timelycapsule
      # Test-only placeholders — google-oauth.test.ts and webhook.test.ts sign/verify
      # entirely locally (fake idTokens / svix's own Webhook.sign()), never calling the
      # real Google or Resend APIs, so any correctly-shaped value works. These aren't
      # real secrets and don't need to be GitHub Actions secrets. Real CI was failing on
      # every run without them — this only ever passed locally because apps/api/.env
      # (gitignored, real values) got auto-loaded there via process.loadEnvFile(),
      # masking the gap; CI has no such file.
      GOOGLE_OAUTH_WEB_CLIENT_ID: test-client-id.apps.googleusercontent.com
      RESEND_WEBHOOK_SECRET: whsec_dGVzdC1vbmx5LXBsYWNlaG9sZGVyLXNlY3JldA==
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json's "packageManager" field —
      # passing `version:` here too causes ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
