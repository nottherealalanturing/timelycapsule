# Production stack for the single EC2 VM (plan/04-ZERO-COST-PLAN.md's
# collapsed topology: Cloudflare -> this VM's Caddy -> api/worker/scheduler
# containers + Postgres, no separate DB host, no Redis).
#
# Usage on the server (see deploy/DEPLOY.md):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# The deploy workflow (.github/workflows/deploy.yml) pushes a freshly built
# image to GHCR and re-runs this same command over SSH, so `image:` here
# must match what CI pushes.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - tc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    image: ghcr.io/${GHCR_OWNER}/timelycapsule-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.production
    command: pnpm --filter @tc/api run db:migrate
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: 'no'

  api:
    image: ghcr.io/${GHCR_OWNER}/timelycapsule-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    command: pnpm --filter @tc/api run start
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4001/health']
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: ghcr.io/${GHCR_OWNER}/timelycapsule-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    command: pnpm --filter @tc/api run start:worker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  scheduler:
    image: ghcr.io/${GHCR_OWNER}/timelycapsule-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    command: pnpm --filter @tc/api run start:scheduler
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  backup:
    build:
      context: ./deploy/backup
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks: [internal]

networks:
  internal:

volumes:
  tc_postgres_data:
  caddy_data:
  caddy_config:
