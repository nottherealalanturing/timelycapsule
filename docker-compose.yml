services:
  postgres:
    image: postgres:16
    container_name: timelycapsule-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: timelycapsule
      POSTGRES_PASSWORD: timelycapsule
      POSTGRES_DB: timelycapsule
    ports:
      # Host port 5433 to avoid clashing with any other local Postgres on 5432.
      - '5433:5432'
    volumes:
      - tc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U timelycapsule']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tc_postgres_data:
