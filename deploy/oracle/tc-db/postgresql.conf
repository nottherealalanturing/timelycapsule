# TimelyCapsule PostgreSQL 16 -- tuned for a 956 MB VM (container limit 512 MB). Managed file; do not edit in place without review.
hba_file   = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'

# --- network: private address only ---
listen_addresses = '10.0.1.4'
port = 5432
unix_socket_directories = '/var/run/postgresql'   # inside the container only; matches libpq default

# --- connections / auth ---
max_connections = 30
superuser_reserved_connections = 3
password_encryption = scram-sha-256
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
idle_in_transaction_session_timeout = '5min'

# --- memory ---
shared_buffers = 96MB
work_mem = 2MB
maintenance_work_mem = 32MB
autovacuum_work_mem = 32MB
autovacuum_max_workers = 2
effective_cache_size = 256MB
temp_buffers = 8MB
wal_buffers = -1
huge_pages = off
shared_memory_type = mmap
dynamic_shared_memory_type = posix
max_worker_processes = 4
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
temp_file_limit = '2GB'

# --- durability: defaults, stated explicitly ---
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
checkpoint_timeout = '10min'
checkpoint_completion_target = 0.9
min_wal_size = '80MB'
max_wal_size = '1GB'
random_page_cost = 1.1

# --- logging (stderr -> Docker log) ---
logging_collector = off
log_timezone = 'UTC'
timezone = 'UTC'
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_temp_files = '10MB'
log_autovacuum_min_duration = '1s'
log_line_prefix = '%m [%p] %u@%d '
