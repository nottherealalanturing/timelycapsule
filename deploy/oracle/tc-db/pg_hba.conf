# TimelyCapsule pg_hba.conf -- first match wins
# TYPE  DATABASE  USER      ADDRESS        METHOD
# Container-local socket: only the container's own OS user "postgres" (mapped to the bootstrap superuser).
local   all       all                      peer map=tcdocker
# The bootstrap superuser is never reachable over the network.
host    all       tc_admin  0.0.0.0/0      reject
host    all       tc_admin  ::/0           reject
# Application access (added 2026-11-06): ONLY the least-privilege role tc_app, ONLY from tc-app (10.0.0.232), password via SCRAM.
host    timelycapsule  tc_app    10.0.0.232/32  scram-sha-256
host    all       all       0.0.0.0/0      reject
host    all       all       ::/0           reject
