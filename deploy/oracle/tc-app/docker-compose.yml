# TimelyCapsule application stack for tc-app (Oracle Always Free, 1 GB RAM).
# Differences from the repo's docker-compose.prod.yml (single-VM, in-compose Postgres, GHCR images):
#  - no postgres service: the database is tc-db (10.0.1.4), reached with DATABASE_URL from .env.production
#  - image is loaded from a local tarball (no registry credentials on the server)
#  - per-service DB pool caps (DB_POOL_MAX / PGBOSS_POOL_MAX) sized to tc_app's connection limit (24)
#  - memory limits, log rotation, dropped capabilities
name: timelycapsule

x-app: &app
  image: timelycapsule-api:${IMAGE_TAG}
  pull_policy: never
  platform: linux/amd64
  env_file: .env.production
  networks: [internal]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: &log
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  migrate:
    <<: *app
    command: ["pnpm", "--filter", "@tc/api", "run", "db:migrate"]
    environment: { DB_POOL_MAX: "2" }
    restart: "no"
    mem_limit: 256m

  api:
    <<: *app
    command: ["pnpm", "--filter", "@tc/api", "run", "start"]
    environment:
      DB_POOL_MAX: "5"
      NODE_OPTIONS: "--max-old-space-size=160"
      TRUST_PROXY_HOPS: "1"          # exactly one proxy hop: Caddy (it writes the real client IP)
      CORS_ORIGINS: "https://timelycapsule.com"
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    <<: *app
    command: ["pnpm", "--filter", "@tc/api", "run", "start:worker"]
    environment: { DB_POOL_MAX: "4", PGBOSS_POOL_MAX: "3", NODE_OPTIONS: "--max-old-space-size=160" }
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      migrate: { condition: service_completed_successfully }

  scheduler:
    <<: *app
    command: ["pnpm", "--filter", "@tc/api", "run", "start:scheduler"]
    environment: { DB_POOL_MAX: "2", PGBOSS_POOL_MAX: "2", NODE_OPTIONS: "--max-old-space-size=128" }
    restart: unless-stopped
    mem_limit: 192m
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    restart: unless-stopped
    networks: [internal]
    ports: ["80:80", "443:443"]
    environment: { API_DOMAIN: "${API_DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro   # origin.pem, origin.key (0600), authenticated_origin_pull_ca.pem
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    logging: *log
    depends_on: [api]

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
